# render.yaml
services:
  - type: web
    name: kanban
    runtime: docker
    repo: https://github.com/justine-neema/kanban
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com,localhost,127.0.0.1
      - key: DB_NAME
        value: kanban
      - key: DB_USER
        value: kanban_user
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432